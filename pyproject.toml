[project]
name = "sherlock-holmes-graph-rag"
version = "0.1.0"
description = "Sistema Graph RAG sobre el canon literario de Sherlock Holmes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "google-genai>=1.0",
    "ollama>=0.4",
    "neo4j>=5.0",
    "tqdm>=4.0",
    "notebook>=7.5.5",
    "pandas>=3.0.2",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
